name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "stable"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "go.sum"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  build:
    name: Build + tidy + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - name: bench module (separate go.mod)
        run: |
          go build -C bench ./...
          go test -C bench ./...
      - name: tidy check
        run: |
          go mod tidy
          go mod tidy -C bench
          git diff --exit-code go.mod go.sum bench/go.mod bench/go.sum
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt drift in:"; echo "$out"; exit 1
          fi

  conformance:
    name: JTS conformance (8951-case corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "go.sum"
      - name: go test -tags=jts
        run: go test -tags=jts -v -run TestJTSConformance ./internal/jtstest/

  apidiff:
    name: API compatibility report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: apidiff vs latest tag (report only)
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "no tag; skipping"; exit 0; fi
          echo "comparing module API against $tag"
          git worktree add /tmp/base "$tag"
          apidiff -m -incompatible /tmp/base . || true

  asan:
    name: Address sanitizer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "go.sum"

      - name: go test -asan
        run: go test -asan ./...
